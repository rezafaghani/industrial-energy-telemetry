upstream telemetry_api {
  zone telemetry_api 64k;
  resolver ${NGINX_LOCAL_RESOLVERS} valid=5s ipv6=off;
  server api:8080 resolve;
}

server {
  listen 80;
  root /usr/share/nginx/html;
  location / { try_files $uri /index.html; }
  location /api/ { proxy_pass http://telemetry_api; proxy_set_header Host $host; }
  location /health/ { proxy_pass http://telemetry_api; proxy_set_header Host api:8080; }
  location /hubs/ {
    proxy_pass http://telemetry_api;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
  }
}
