<mat-card>
  <mat-card-header><mat-card-title>Register OPC UA server</mat-card-title></mat-card-header>
  <mat-card-content>
    <form class="server-form" #serverForm="ngForm" (ngSubmit)="submit()">
      @for (field of fields; track field.key) {
        <mat-form-field appearance="outline">
          <mat-label>{{ field.label }}</mat-label>
          <input matInput [name]="field.key" [(ngModel)]="server[field.key]" required />
        </mat-form-field>
      }
      <div class="form-actions">
        <button mat-flat-button type="submit" [disabled]="serverForm.invalid || pending()">Register server</button>
      </div>
    </form>
    @if (pending()) { <mat-progress-bar mode="indeterminate" aria-label="Registering server" /> }
    @if (error()) { <mat-card class="query-error" role="alert">{{ error() }}</mat-card> }
  </mat-card-content>
</mat-card>
