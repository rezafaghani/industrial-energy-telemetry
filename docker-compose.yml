x-dotnet-build: &dotnet-build
  context: .
  dockerfile: infrastructure/docker/dotnet-service.Dockerfile
x-server: &server
  build:
    <<: *dotnet-build
    args: { PROJECT: OpcUa.Server }
  restart: unless-stopped
  environment: &server-env
    DOTNET_ENVIRONMENT: Development
    OpcUa__AllowUnsecuredDevelopmentEndpoint: "true"
x-client: &client
  build:
    <<: *dotnet-build
    args: { PROJECT: OpcUa.Client }
  restart: unless-stopped
  depends_on:
    kafka-init: { condition: service_completed_successfully }
  environment: &client-env
    OpcUaClient__KafkaBootstrapServers: kafka:9092
    OpcUaClient__UseSecurity: "false"
    OpcUaClient__CoordinatorUrl: http://api:8080
    OpcUaClient__CollectorCapacity: "1"
    OpcUaClient__LeaseSeconds: "30"
    OpcUaClient__CoordinatorIntervalSeconds: "10"
x-processor: &processor
  build:
    <<: *dotnet-build
    args: { PROJECT: Telemetry.Processor }
  restart: unless-stopped
  depends_on:
    kafka-init: { condition: service_completed_successfully }
  environment:
    Processor__BootstrapServers: kafka:9092
x-inserter: &inserter
  build:
    <<: *dotnet-build
    args: { PROJECT: Telemetry.Inserter }
  restart: unless-stopped
  depends_on:
    kafka-init: { condition: service_completed_successfully }
    postgres-init: { condition: service_completed_successfully }
  environment:
    Inserter__BootstrapServers: kafka:9092
    Inserter__ConnectionString: Host=postgres;Database=ietp;Username=ietp;Password=ietp-dev-only

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment: { POSTGRES_DB: ietp, POSTGRES_USER: ietp, POSTGRES_PASSWORD: ietp-dev-only }
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./infrastructure/postgres/001_initial.sql:/docker-entrypoint-initdb.d/001_initial.sql:ro,Z
    ports: ["5432:5432"]

  postgres-init:
    image: postgres:18-alpine
    depends_on: { postgres: { condition: service_started } }
    environment: { PGPASSWORD: ietp-dev-only }
    command: ["sh", "-c", "until pg_isready -h postgres -U ietp -d ietp; do sleep 1; done"]

  kafka:
    image: apache/kafka:4.1.0
    restart: unless-stopped
    environment:
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes: ["kafka-data:/var/lib/kafka/data"]
    ports: ["9092:9092"]

  kafka-init:
    image: apache/kafka:4.1.0
    depends_on: { kafka: { condition: service_started } }
    command: >-
      sh -c 'until /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic telemetry.raw --partitions 12 --replication-factor 1; do sleep 2; done &&
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic telemetry.processed --partitions 12 --replication-factor 1 &&
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic telemetry.dead-letter --partitions 6 --replication-factor 1 &&
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic telemetry.status --partitions 6 --replication-factor 1'

  opcua-wind:
    <<: *server
    environment: { <<: *server-env, OpcUa__ServerId: windfarm01, OpcUa__Endpoint: "opc.tcp://0.0.0.0:4841/ietp", OpcUa__NamespaceUri: "urn:ietp:dk:demo:windfarm01", OpcUa__AssetId: turbine01, OpcUa__Profile: WindFarm, OpcUa__Seed: 11 }
    ports: ["4841:4841"]
  opcua-solar:
    <<: *server
    profiles: [full-demo]
    environment: { <<: *server-env, OpcUa__ServerId: solarfarm01, OpcUa__Endpoint: "opc.tcp://0.0.0.0:4842/ietp", OpcUa__NamespaceUri: "urn:ietp:dk:demo:solarfarm01", OpcUa__AssetId: inverter01, OpcUa__Profile: SolarFarm, OpcUa__Seed: 22 }
    ports: ["4842:4842"]
  opcua-grid:
    <<: *server
    profiles: [full-demo]
    environment: { <<: *server-env, OpcUa__ServerId: grid01, OpcUa__Endpoint: "opc.tcp://0.0.0.0:4843/ietp", OpcUa__NamespaceUri: "urn:ietp:dk:demo:grid01", OpcUa__AssetId: feeder01, OpcUa__Profile: PowerGrid, OpcUa__Seed: 33 }
    ports: ["4843:4843"]
  opcua-battery:
    <<: *server
    profiles: [full-demo]
    environment: { <<: *server-env, OpcUa__ServerId: battery01, OpcUa__Endpoint: "opc.tcp://0.0.0.0:4844/ietp", OpcUa__NamespaceUri: "urn:ietp:dk:demo:battery01", OpcUa__AssetId: bess01, OpcUa__Profile: BatteryStorage, OpcUa__Seed: 44 }
    ports: ["4844:4844"]
  opcua-plant:
    <<: *server
    profiles: [full-demo]
    environment: { <<: *server-env, OpcUa__ServerId: plant01, OpcUa__Endpoint: "opc.tcp://0.0.0.0:4845/ietp", OpcUa__NamespaceUri: "urn:ietp:dk:demo:plant01", OpcUa__AssetId: motor01, OpcUa__Profile: IndustrialPlant, OpcUa__Seed: 55 }
    ports: ["4845:4845"]

  client-wind:
    <<: *client
    depends_on: { kafka-init: { condition: service_completed_successfully }, opcua-wind: { condition: service_started } }
    environment: { <<: *client-env, OpcUaClient__SiteId: windfarm01 }
  client-solar:
    <<: *client
    profiles: [full-demo]
    depends_on: { kafka-init: { condition: service_completed_successfully }, opcua-solar: { condition: service_started } }
    environment: { <<: *client-env, OpcUaClient__SiteId: solarfarm01 }
  client-grid:
    <<: *client
    profiles: [full-demo]
    depends_on: { kafka-init: { condition: service_completed_successfully }, opcua-grid: { condition: service_started } }
    environment: { <<: *client-env, OpcUaClient__SiteId: grid01 }
  client-battery:
    <<: *client
    profiles: [full-demo]
    depends_on: { kafka-init: { condition: service_completed_successfully }, opcua-battery: { condition: service_started } }
    environment: { <<: *client-env, OpcUaClient__SiteId: battery01 }
  client-plant:
    <<: *client
    profiles: [full-demo]
    depends_on: { kafka-init: { condition: service_completed_successfully }, opcua-plant: { condition: service_started } }
    environment: { <<: *client-env, OpcUaClient__SiteId: plant01 }

  processor-1: { <<: *processor }
  processor-2: { <<: *processor, profiles: [scale-out] }
  inserter-1: { <<: *inserter }
  inserter-2: { <<: *inserter, profiles: [scale-out] }
  postgres-schema-init:
    image: postgres:18-alpine
    depends_on: { inserter-1: { condition: service_started } }
    environment: { PGPASSWORD: ietp-dev-only }
    command: ["sh", "-c", "until psql -h postgres -U ietp -d ietp -tAc \"SELECT to_regclass('control_plane.collectors')\" | grep -q collectors; do sleep 1; done"]
  api:
    build: { context: ., dockerfile: infrastructure/docker/api.Dockerfile }
    restart: unless-stopped
    depends_on: { postgres-schema-init: { condition: service_completed_successfully } }
    environment: { ConnectionStrings__Telemetry: "Host=postgres;Database=ietp;Username=ietp;Password=ietp-dev-only", ASPNETCORE_URLS: "http://+:8080" }
    ports: ["8080:8080"]
  frontend:
    build: { context: ., dockerfile: infrastructure/docker/frontend.Dockerfile }
    restart: unless-stopped
    depends_on: { api: { condition: service_started } }
    ports: ["3000:80"]
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.138.0
    profiles: [observability]
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes: ["./infrastructure/observability/otel-collector.yaml:/etc/otelcol/config.yaml:ro"]
    ports: ["4317:4317", "4318:4318", "9464:9464"]
  jaeger:
    image: jaegertracing/all-in-one:1.76.0
    profiles: [observability]
    environment: { COLLECTOR_OTLP_ENABLED: "true" }
    ports: ["16686:16686"]
  prometheus:
    image: prom/prometheus:v3.7.3
    profiles: [observability]
    volumes: ["./infrastructure/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["9090:9090"]
  grafana:
    image: grafana/grafana:12.2.1
    profiles: [observability]
    environment: { GF_SECURITY_ADMIN_PASSWORD: ietp-dev-only }
    volumes: ["./infrastructure/observability/grafana-datasources.yaml:/etc/grafana/provisioning/datasources/ietp.yaml:ro", "grafana-data:/var/lib/grafana"]
    ports: ["3001:3000"]

volumes: { postgres-data: {}, kafka-data: {}, grafana-data: {} }
